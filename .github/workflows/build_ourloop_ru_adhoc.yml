name: Build OurLoop RU AdHoc
run-name: Build OurLoop RU AdHoc (${{ github.ref_name }})

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ADHOC_P12_BASE64:
        required: true
      ADHOC_P12_PASSWORD:
        required: true
      ADHOC_MOBILEPROVISION_BASE64:
        required: true

permissions:
  contents: read

jobs:
  build-adhoc:
    name: Build unsigned, strip extensions, and sign Ad Hoc
    if: github.ref == 'refs/heads/ourloop-ru'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout OurLoop RU
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.5.app ]]; then
            sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Apply diagnostic dosing safety lock
        shell: bash
        run: |
          set -euo pipefail
          git -C Loop apply --unidiff-zero --check ../submodule-patches/ourloop-ru-diagnostic-safety.patch
          git -C Loop apply --unidiff-zero --whitespace=fix ../submodule-patches/ourloop-ru-diagnostic-safety.patch

      - name: Build and sign iPhone-only Ad Hoc IPA
        shell: bash
        env:
          ADHOC_P12_BASE64: ${{ secrets.ADHOC_P12_BASE64 }}
          ADHOC_P12_PASSWORD: ${{ secrets.ADHOC_P12_PASSWORD }}
          ADHOC_MOBILEPROVISION_BASE64: ${{ secrets.ADHOC_MOBILEPROVISION_BASE64 }}
        run: bash .github/scripts/build_ourloop_ru_adhoc.sh

      - name: Upload diagnostic IPA
        uses: actions/upload-artifact@v6
        with:
          name: OurLoop-RU-AdHoc-IPA
          path: artifacts/OurLoop-RU-AdHoc.ipa
          if-no-files-found: error
          retention-days: 7
